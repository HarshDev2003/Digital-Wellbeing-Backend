name: digital_wellbeing_mobile
description: Lightweight cross-platform background activity collector for Digital Wellbeing
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Type-safe, reactive local SQLite database (Zero heavy UI / Zero local ML)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking & HTTP
  http: ^1.2.1

  # Unique event & session IDs
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drift code generation
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

  # Strict linting rules
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
